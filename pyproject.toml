[project]
name = "mes-continual-learning"
version = "0.1.0"
description = "Point-in-time features and candidate safety gate for MES continual learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
v5 = ["scikit-learn>=1.7", "lightgbm>=4.6", "openpyxl>=3.1"]

[tool.setuptools]
packages = ["mes_cl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
